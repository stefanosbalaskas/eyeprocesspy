<text x="332.5" y="134" text-anchor="middle" class="k">Requested term</text><text x="332.5" y="153" text-anchor="middle" class="k">available</text><text x="332.5" y="190" text-anchor="middle" class="n">5</text>
<path class="line" d="M405 160 H455"/><path d="M455 160 l-11 -7 v14 z" fill="currentColor" fill-opacity=".55"/>
