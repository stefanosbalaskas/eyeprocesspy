<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:14px}.title{font-size:21px;font-weight:650}.small{font-size:12px}.label{font-size:13px;font-weight:600}.bar{fill:currentColor;fill-opacity:.11;stroke:currentColor;stroke-opacity:.45}.drop{fill:currentColor;fill-opacity:.055;stroke:currentColor;stroke-opacity:.32}.line{stroke:currentColor;stroke-opacity:.48;stroke-width:2}</style>
<text x="410" y="30" text-anchor="middle" class="title">Model-input audit: deliberate failure clinic</text>
<text x="410" y="54" text-anchor="middle" class="small">I-VT branch; exact row accounting from the seeded synthetic clinic</text>
<text x="80" y="96" class="label">All propagated rows</text><rect class="bar" x="250" y="78" width="480" height="34" rx="8"/><text x="744" y="101">16</text>
<line class="line" x1="490" y1="112" x2="490" y2="133"/>
<text x="80" y="157" class="label">Target AOI selected</text><rect class="bar" x="250" y="139" width="240" height="34" rx="8"/><text x="504" y="162">8</text>
<line class="line" x1="370" y1="173" x2="370" y2="194"/>
<text x="80" y="218" class="label">Quality exclusion</text><rect class="drop" x="250" y="200" width="30" height="34" rx="8"/><text x="294" y="223">1 excluded</text>
<line class="line" x1="370" y1="234" x2="370" y2="255"/>
<text x="80" y="279" class="label">Non-finite outcome</text><rect class="drop" x="250" y="261" width="30" height="34" rx="8"/><text x="294" y="284">1 recorded</text>
<line class="line" x1="340" y1="295" x2="340" y2="316"/>
<text x="80" y="340" class="label">Rows supplied to model</text><rect class="bar" x="250" y="322" width="180" height="34" rx="8"/><text x="444" y="345">6</text>
<rect class="drop" x="555" y="205" width="190" height="105" rx="12"/>
<text x="650" y="235" text-anchor="middle" class="label">External detector branch</text>
<text x="650" y="267" text-anchor="middle" style="font-size:25px;font-weight:700">0 model rows</text>
<text x="650" y="291" text-anchor="middle" class="small">status = no_model_data</text>
<text x="410" y="397" text-anchor="middle" class="small">AOI selection, quality exclusion, missing outcome and backend failure are retained as distinct states; missing outcomes are never recoded as zero.</text>
</svg>