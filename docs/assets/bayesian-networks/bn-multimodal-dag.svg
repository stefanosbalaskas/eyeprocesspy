<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>.n{fill:#f8fafc;stroke:#2563eb;stroke-width:3}.t{font:600 22px Arial;fill:#16324f;text-anchor:middle}.a{stroke:#334155;stroke-width:3;marker-end:url(#m)}.s{font:16px Arial;fill:#64748b;text-anchor:middle}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="1000" height="520" fill="white"/><text x="500" y="40" class="t">Multimodal Bayesian network</text><line x1="210" y1="260" x2="350" y2="170" class="a"/><line x1="210" y1="260" x2="350" y2="350" class="a"/><line x1="510" y1="170" x2="630" y2="140" class="a"/><line x1="510" y1="170" x2="630" y2="260" class="a"/><line x1="510" y1="170" x2="630" y2="380" class="a"/><line x1="210" y1="260" x2="630" y2="380" class="a"/><line x1="790" y1="380" x2="870" y2="380" class="a"/><rect x="50" y="220" width="160" height="80" rx="16" class="n"/><text x="130" y="267" class="t">Condition</text><rect x="350" y="130" width="160" height="80" rx="16" class="n"/><text x="430" y="178" class="t">Gaze</text><rect x="350" y="310" width="160" height="80" rx="16" class="n"/><text x="430" y="358" class="t">Control</text><rect x="630" y="100" width="160" height="80" rx="16" class="n"/><text x="710" y="148" class="t">Pupil</text><rect x="630" y="220" width="160" height="80" rx="16" class="n"/><text x="710" y="268" class="t">EDA</text><rect x="630" y="340" width="160" height="80" rx="16" class="n"/><text x="710" y="388" class="t">Trust</text><rect x="870" y="340" width="110" height="80" rx="16" class="n"/><text x="925" y="388" class="t">Choice</text><text x="500" y="485" class="s">Validated features enter the BN after preprocessing; arrows encode modeled dependencies, not automatic causal claims.</text></svg>