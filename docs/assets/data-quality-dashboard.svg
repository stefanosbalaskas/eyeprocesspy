<title id="title">Synthetic standardized gaze data-quality dashboard</title>
<desc id="desc">Four bar-chart panels show exact deterministic center-target results for six synthetic validation profiles: target-referenced accuracy, RMS sample-to-sample precision, 68 percent BCEA, and valid sample fraction.</desc>
