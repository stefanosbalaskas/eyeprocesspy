name: CI
on:
  push:
  pull_request:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - name: Ruff regression gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python scripts/ruff_delta.py --base "$BASE_SHA"
      - name: Ruff full repository gate
        run: uv run --frozen ruff check .
      - name: Mypy source gate
        run: uv run --frozen mypy src/eyeprocesspy

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --no-sources
      - name: Strict distribution metadata validation
        run: uvx twine check --strict dist/*
      - run: python -m venv wheelcheck
      - run: wheelcheck/bin/pip install dist/*.whl
      - run: wheelcheck/bin/pip check
      - run: wheelcheck/bin/python -c "import eyeprocesspy; print(eyeprocesspy.__version__, eyeprocesspy.__r_reference_version__)"
      - name: Clean sdist install smoke
        run: |
          python -m venv sdistcheck
          sdistcheck/bin/pip install dist/*.tar.gz
          sdistcheck/bin/pip check
          sdistcheck/bin/python -c "import eyeprocesspy; print(eyeprocesspy.__version__, eyeprocesspy.__r_reference_version__)"
      - name: Upload manual-install distributions
        uses: actions/upload-artifact@v4
        with:
          name: eyeprocesspy-manual-install-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  r-oracle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Download frozen R reference
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -o eyeprocess_0.11.1.tar.gz \
            https://github.com/stefanosbalaskas/eyeprocess/releases/download/v0.11.1/eyeprocess_0.11.1.tar.gz
          echo "fd2638d7ccf0c5dd5a18745aed59c2f647e142c1753a339a2ab8ca99c3fd5d0a  eyeprocess_0.11.1.tar.gz" | sha256sum -c -
      - name: Install frozen R reference
        run: R CMD INSTALL eyeprocess_0.11.1.tar.gz
      - name: Verify R oracle
        run: Rscript scripts/run_r_oracle.R
