name: One-shot P4 evidence refresh

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - .github/workflows/one-shot-p4-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
          fetch-depth: 0
      - name: Refresh exact test-referenced P4 evidence
        shell: bash
        run: |
          python tools/refresh_parity_from_tests.py --apply | tee p4-refresh.log
          grep -q '^P4_TEST_REFERENCED_UPGRADES=49$' p4-refresh.log
          grep -q '^P4_STILL_NOT_STARTED=0$' p4-refresh.log
          grep -q '^PARITY_MATRIX_UPDATED=1$' p4-refresh.log
          if grep -q ',not_started,' parity/PARITY_MATRIX.csv; then
            echo 'Unexpected residual not_started rows remain in parity matrix.' >&2
            exit 1
          fi
      - name: Commit refreshed evidence and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-p4-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parity/PARITY_MATRIX.csv .github/workflows/one-shot-p4-refresh.yml
          git commit -m "parity: close final 49 test-referenced P4 rows"
          git push origin HEAD:release/0.1.0-deep-parity
