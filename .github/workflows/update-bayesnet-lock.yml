name: Refresh Bayesian network lockfile

on:
  push:
    branches:
      - feature/bayesian-networks

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bayesian-networks
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Refresh uv.lock
        run: uv lock

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-bayesnet-lock.yml
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh lockfile for Bayesian network dependency"
          git push origin HEAD:feature/bayesian-networks
