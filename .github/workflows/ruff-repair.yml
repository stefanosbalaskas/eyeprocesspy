name: Ruff repair

on:
  push:
    paths:
      - '.github/workflows/ruff-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded import-only Ruff repairs
        shell: python
        run: |
          from pathlib import Path

          # 1) New implementation: canonical stdlib ordering + modern ABC imports.
          path = Path('src/eyeprocesspy/measurement_accountability_11.py')
          text = path.read_text(encoding='utf-8')
          old = 'from typing import Iterable, Mapping, Sequence\nimport math\nimport random\n'
          new = 'import math\nimport random\nfrom collections.abc import Iterable, Mapping, Sequence\n'
          if old not in text:
              raise SystemExit(f'expected implementation import block not found in {path}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) New test: pytest must be in the import block, not after test functions.
          path = Path('tests/test_measurement_accountability_11.py')
          text = path.read_text(encoding='utf-8')
          tail = '\n\n\nimport pytest'
          if tail not in text:
              raise SystemExit(f'expected trailing pytest import not found in {path}')
          text = text.replace(tail, '', 1)
          anchor = 'import math\n\n'
          if anchor not in text:
              raise SystemExit(f'expected math import block not found in {path}')
          text = text.replace(anchor, 'import math\n\nimport pytest\n\n', 1)
          path.write_text(text + '\n', encoding='utf-8')

          # 3) Public API block: sort the two newly adjacent relative imports.
          path = Path('src/eyeprocesspy/__init__.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .validation_atlas_09 import *\nfrom .measurement_accountability_11 import event_marker_qc, pupil_latency_sensitivity, validation_ladder\n'
          new = 'from .measurement_accountability_11 import event_marker_qc, pupil_latency_sensitivity, validation_ladder\nfrom .validation_atlas_09 import *\n'
          if old not in text:
              raise SystemExit(f'expected public import block not found in {path}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/eyeprocesspy/measurement_accountability_11.py tests/test_measurement_accountability_11.py src/eyeprocesspy/__init__.py
          git commit -m 'ci: satisfy Ruff for measurement accountability tranche'
          git push