name: One-shot core plots assertion fix

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - .github/workflows/one-shot-core-plots-assertion-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
          fetch-depth: 0
      - name: Apply exact test correction and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_core_plots_10_residual_coverage.py')
          text = path.read_text(encoding='utf-8')
          old = '''    no_derived = episodes.drop(columns=["derived_by"], errors="ignore")
              axis = ep.plot_fixations(_copy_with(dataset, episodes=no_derived), source="vendor")
              assert not axis.eyeprocess_plot_data.empty
              _close(axis)
          '''
          # Keep indentation exact to the file while making only the assertion semantic change.
          old = old.replace('          axis', '    axis').replace('          assert', '    assert').replace('          _close', '    _close')
          new = old.replace('assert not axis.eyeprocess_plot_data.empty', 'assert axis.eyeprocess_plot_data.empty')
          if text.count(old) != 1:
              raise SystemExit(f'exact target count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-shot-core-plots-assertion-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: correct empty fixation branch assertion"
          git push origin HEAD:release/0.1.0-deep-parity
