name: Finalize v0.1.0 GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-v0.1.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
          TARGET_SHA: 3afa99597c3505372cabb76ef05099f8c9d0735e
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "${actual}" = "${TARGET_SHA}"
          echo "${RELEASE_TAG} -> ${actual}"

      - name: Download already validated release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 33782230454 \
            --repo "${GITHUB_REPOSITORY}" \
            --name python-distributions \
            --dir dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"

      - name: Create GitHub Release from published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "eyeprocesspy 0.1.0"
          fi
