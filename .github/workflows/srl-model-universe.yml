name: SRL frozen model universe

on:
  workflow_dispatch:
    inputs:
      measurement_run_id:
        description: GitHub Actions run ID containing the validated measurement artifact
        required: true
        type: string
      measurement_artifact_name:
        description: Exact validated measurement artifact name
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESEARCH_DIR: research/gaze_claim_robustness
      EXPECTED_MEASUREMENT_ROWS: "23616"
      EXPECTED_MODEL_SPECS: "144"
      FROZEN_GLMMTMB_VERSION: "1.1.14"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install frozen Python environment
        run: uv sync --frozen --extra dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install frozen glmmTMB estimator
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'NA'
          packages: any::sessioninfo
          extra-packages: |
            any::glmmTMB@1.1.14
          cache-version: srl-glmmtmb-1.1.14

      - name: Verify frozen R estimator version
        shell: bash
        run: |
          Rscript - <<'RS'
          expected <- Sys.getenv("FROZEN_GLMMTMB_VERSION")
          actual <- as.character(utils::packageVersion("glmmTMB"))
          cat("glmmTMB version:", actual, "\n")
          if (!identical(actual, expected)) {
            stop(
              "Expected glmmTMB ", expected,
              "; installed ", actual,
              ". No version substitution is permitted."
            )
          }
          RS

      - name: Download validated measurement artifact
        shell: bash
        env:
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          MEASUREMENT_ARTIFACT_NAME: ${{ inputs.measurement_artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download "$MEASUREMENT_RUN_ID"             --name "$MEASUREMENT_ARTIFACT_NAME"             --dir input

      - name: Verify measurement artifact is model-free and structurally complete
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/validate_srl_measurement_artifact.py" \
            input/measurement/srl_measurement_counts.csv \
            --identity-presence-csv input/evidence/identity/id_source_presence.csv \
            --output input/measurement/srl_measurement_structure_audit.csv

          test -f input/evidence/timebase/participant_timebase_summary.csv

      - name: Materialize frozen 144-specification model universe
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/build_srl_primary_universe.py"             --research-dir "$RESEARCH_DIR"             --output-dir frozen_universe

          uv run --frozen python - <<'PY'
          import os
          import pandas as pd

          d = pd.read_csv("frozen_universe/srl_primary_universe.csv")
          expected = int(os.environ["EXPECTED_MODEL_SPECS"])
          if len(d) != expected:
              raise SystemExit(
                  f"Expected {expected} model specifications; found {len(d)}."
              )
          if d["specification_hash"].nunique() != expected:
              raise SystemExit("Frozen model universe contains duplicate hashes.")
          print("Frozen model specifications:", len(d))
          PY

      - name: Fit all frozen Prompt transition-rate models
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/run_srl_model_universe.py"             input/measurement/srl_measurement_counts.csv             frozen_universe/srl_primary_universe.csv             input/evidence/identity/id_source_presence.csv             input/evidence/timebase/participant_timebase_summary.csv             --r-script "$RESEARCH_DIR/fit_srl_primary_glmm.R"             --output-dir model_results

      - name: Verify complete model ledger
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          import os
          import pandas as pd

          path = "model_results/srl_multiverse_model_results.csv"
          d = pd.read_csv(path)
          expected = int(os.environ["EXPECTED_MODEL_SPECS"])
          if len(d) != expected:
              raise SystemExit(
                  f"Expected {expected} model result rows; found {len(d)}."
              )
          if d["universe_id"].nunique() != expected:
              raise SystemExit("Model ledger has duplicate/missing universe IDs.")
          if d["specification_hash"].nunique() != expected:
              raise SystemExit("Model ledger has duplicate/missing specification hashes.")

          print(
              "Model ledger:",
              f"planned={len(d)}",
              f"ok={int(d['status'].eq('ok').sum())}",
              f"non_ok={int((~d['status'].eq('ok')).sum())}",
          )
          PY

      - name: Produce descriptive robustness summaries
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/summarise_srl_multiverse.py"             model_results/srl_multiverse_model_results.csv             --output-dir summary

      - name: Record analysis provenance
        shell: bash
        env:
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          MEASUREMENT_ARTIFACT_NAME: ${{ inputs.measurement_artifact_name }}
        run: |
          set -euo pipefail
          {
            echo "analysis_head_sha=$GITHUB_SHA"
            echo "measurement_run_id=$MEASUREMENT_RUN_ID"
            echo "measurement_artifact_name=$MEASUREMENT_ARTIFACT_NAME"
            echo "glmmTMB_version=$FROZEN_GLMMTMB_VERSION"
            sha256sum input/measurement/srl_measurement_counts.csv
            sha256sum frozen_universe/srl_primary_universe.csv
            sha256sum model_results/srl_multiverse_model_results.csv
          } > model_results/ANALYSIS_PROVENANCE.txt

      - name: Upload model and summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srl-frozen-model-universe-${{ github.sha }}
          path: |
            frozen_universe/
            model_results/
            summary/
          if-no-files-found: error
          retention-days: 30
