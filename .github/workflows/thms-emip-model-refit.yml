name: THMS EMIP frozen model refit
on:
  push:
    branches: [research/thms-routeb-emip]
    paths:
      - research/gaze_claim_robustness/verify_emip_mirror_models.py
      - research/gaze_claim_robustness/results/emip_mirror_derived_batch_*.csv
      - research/gaze_claim_robustness/results/emip_mirror_model_summary.csv
      - .github/workflows/thms-emip-model-refit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-frozen-emip-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent model check dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'statsmodels>=0.14,<0.16'
      - name: Refit 24 models and compare against frozen reported values
        run: python research/gaze_claim_robustness/verify_emip_mirror_models.py
