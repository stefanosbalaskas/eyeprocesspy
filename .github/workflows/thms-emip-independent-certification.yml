name: THMS EMIP independent raw-to-claim certification

on:
  push:
    branches: [research/thms-routeb-emip]
    paths:
      - research/gaze_claim_robustness/independent_emip_raw_to_claim.py
      - .github/workflows/thms-emip-independent-certification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-raw-to-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit-only dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'statsmodels>=0.14,<0.16' 'requests>=2.31,<3'
      - name: Synthetic algorithmic unit tests
        run: python research/gaze_claim_robustness/independent_emip_raw_to_claim.py --selftest
      - name: Reconstruct original raw gaze to 24 fixed claim models
        run: python research/gaze_claim_robustness/independent_emip_raw_to_claim.py --out emip_independent_audit
      - name: Publish audit report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thms-emip-independent-raw-to-claim
          path: emip_independent_audit/
          if-no-files-found: warn
          retention-days: 90
