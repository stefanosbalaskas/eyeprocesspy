name: One-shot process governance writable matrix fix

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - .github/workflows/_patch_process_governance_numpy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
          fetch-depth: 0
      - name: Make anomaly matrix writable and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/eyeprocesspy/process_governance_08.py')
          text = p.read_text(encoding='utf-8')
          old = 'X=q[metrics].to_numpy(float)'
          new = 'X=q[metrics].to_numpy(float).copy()'
          if text.count(old) != 1:
              raise SystemExit(f'guard failed: expected exactly one {old!r}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/_patch_process_governance_numpy.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/eyeprocesspy/process_governance_08.py .github/workflows/_patch_process_governance_numpy.yml
          git commit -m "fix: make process anomaly matrix writable"
          git push origin HEAD:release/0.1.0-deep-parity
