name: One-shot functional pupil window correction

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - .github/workflows/one-shot-fix-functional-window.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
      - name: Correct no-sample time-window fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_functional_pupil_residual_coverage.py')
          text = path.read_text(encoding='utf-8')
          old = 'clipped = _event_spec(time_window=(-50, 50))'
          new = 'clipped = _event_spec(time_window=(1000, 1100))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-fix-functional-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_functional_pupil_residual_coverage.py .github/workflows/one-shot-fix-functional-window.yml
          git commit -m "test: correct functional pupil empty-window guard"
          git push origin HEAD:release/0.1.0-deep-parity