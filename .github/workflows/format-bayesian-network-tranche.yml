name: Format Bayesian network tranche

on:
  push:
    branches:
      - feature/bayesian-networks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bayesian-networks
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - run: uv sync --frozen --extra dev

      - name: Apply Ruff fixes
        run: |
          uv run --frozen ruff check --fix             src/eyeprocesspy/bayesian_networks             examples/bayesian_network_multimodal.py             tests/test_bayesian_networks_contract.py             tests/test_bayesian_networks_docs.py             tests/test_bayesian_networks_pgmpy_adapter.py             tests/test_bayesian_networks_pgmpy_integration.py             tests/test_bayesian_networks_provenance.py             tests/test_bayesian_networks_workflow.py
          uv run --frozen ruff format             src/eyeprocesspy/bayesian_networks             examples/bayesian_network_multimodal.py             tests/test_bayesian_networks_contract.py             tests/test_bayesian_networks_docs.py             tests/test_bayesian_networks_pgmpy_adapter.py             tests/test_bayesian_networks_pgmpy_integration.py             tests/test_bayesian_networks_provenance.py             tests/test_bayesian_networks_workflow.py

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-bayesian-network-tranche.yml
          git add src/eyeprocesspy/bayesian_networks examples/bayesian_network_multimodal.py tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Bayesian network tranche"
          git push origin HEAD:feature/bayesian-networks
