name: Refresh survival lock

on:
  push:
    branches:
      - feature/censored-gaze-survival
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-survival-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "survival-lock-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Regenerate universal uv lock
        run: uv lock
      - name: Verify generated lock
        run: uv lock --check
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: survival-uv-lock-${{ github.sha }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
