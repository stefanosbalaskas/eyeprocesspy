name: One-shot functional Stan item-key fix

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - .github/workflows/one-shot-fix-functional-stan-items.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
      - name: Patch Stan item-list access and test contract
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/eyeprocesspy/functional_pupil.py')
          text = source.read_text(encoding='utf-8')
          old = '"J":len(prepared.items),"B":basis_matrix.shape[1]'
          new = '"J":len(prepared["items"]),"B":basis_matrix.shape[1]'
          if text.count(old) != 1:
              raise SystemExit(f'expected one J target, found {text.count(old)}')
          text = text.replace(old, new)
          old = '"trial_item":[prepared.items.index(v)+1 for v in trials.item_id]'
          new = '"trial_item":[prepared["items"].index(v)+1 for v in trials.item_id]'
          if text.count(old) != 1:
              raise SystemExit(f'expected one trial_item target, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_functional_pupil_residual_coverage.py')
          text = test.read_text(encoding='utf-8')
          old = 'match="Could not identify pupil column"'
          new = 'match="Pupil column `pupil` is unavailable"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one message target, found {text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-fix-functional-stan-items.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/eyeprocesspy/functional_pupil.py tests/test_functional_pupil_residual_coverage.py .github/workflows/one-shot-fix-functional-stan-items.yml
          git commit -m "fix: use keyed item list in functional Stan adapter"
          git push origin HEAD:release/0.1.0-deep-parity