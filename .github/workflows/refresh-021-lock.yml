name: Refresh 0.2.1 lockfile

on:
  push:
    branches:
      - release/0.2.1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.2.1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh uv.lock
        run: uv lock
      - name: Commit refreshed lockfile and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-021-lock.yml
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh uv.lock for eyeprocesspy 0.2.1"
          git push origin HEAD:release/0.2.1
