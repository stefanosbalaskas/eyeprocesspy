name: Apply dynamic IRT exact fixes

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - "tools/apply_dynamic_coverage_fixes.py"
      - ".github/workflows/one-shot-dynamic-coverage-fixes.yml"

permissions:
  contents: write

concurrency:
  group: dynamic-irt-exact-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply exact source corrections
        run: uv run python tools/apply_dynamic_coverage_fixes.py
      - name: Verify focused dynamic suite
        run: |
          uv sync --extra dev
          uv run pytest -q tests/test_dynamic_strategy_diffusion.py
          uv run ruff check src/eyeprocesspy/dynamic_irt.py
      - name: Remove dependency-sync noise
        run: git restore uv.lock
      - name: Remove one-shot patch machinery
        run: |
          git rm tools/apply_dynamic_coverage_fixes.py
          git rm .github/workflows/one-shot-dynamic-coverage-fixes.yml
      - name: Commit verified source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/eyeprocesspy/dynamic_irt.py
          git commit -m "fix: harden dynamic IRT pandas and Stan extraction paths"
          git pull --rebase origin release/0.1.0-deep-parity
          git push origin HEAD:release/0.1.0-deep-parity