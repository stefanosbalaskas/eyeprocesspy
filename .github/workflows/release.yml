name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      should_validate: ${{ steps.resolve.outputs.should_validate }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Resolve release intent
        shell: bash
        run: |
          version="$(python - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          release_tag="v${version}"
          should_validate=false
          should_release=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${release_tag}" >&2
              exit 1
            fi
            should_validate=true
            should_release=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              echo "${release_tag} already exists; this main push is not a new release."
            else
              should_validate=true
              should_release=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_validate=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_validate=${should_validate}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

  validate:
    if: needs.resolve_release.outputs.should_validate == 'true'
    needs: resolve_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync release environment
        run: uv sync --frozen --extra dev --extra narrow
      - name: Verify package versions and release tag
        env:
          RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_version = os.environ["RELEASE_VERSION"]
          expected_tag = os.environ["RELEASE_TAG"]
          if version != expected_version:
              raise SystemExit(f"Resolved version {expected_version!r} does not match pyproject version {version!r}")
          if expected_tag != f"v{version}":
              raise SystemExit(f"Resolved release tag {expected_tag!r} does not match package version v{version}")
          init_text = Path("src/eyeprocesspy/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit("pyproject.toml and eyeprocesspy.__version__ disagree")
          print("release version:", version)
          print("release tag:", expected_tag)
          PY
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy src/eyeprocesspy
      - name: Full tests and exact 100% branch coverage
        run: uv run --frozen pytest --cov=eyeprocesspy --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=100
      - name: Verify zero missing coverage counters
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(
              Path("coverage.json").read_text(encoding="utf-8")
          )["totals"]

          missing_lines = int(totals["missing_lines"])
          missing_branches = int(totals["missing_branches"])

          if missing_lines != 0 or missing_branches != 0:
              raise SystemExit(
                  f"coverage gap: lines={missing_lines}, "
                  f"branches={missing_branches}"
              )

          print("exact 100% statement + branch coverage")
          PY
      - name: Deep parity release gate
        run: uv run --frozen python tools/deep_parity_audit.py --release-gate
      - name: Public API documentation gate
        run: uv run --frozen python tools/api_documentation_audit.py
      - name: Build documentation strictly
        run: uv run --frozen mkdocs build --strict
      - name: Audit published dependencies
        run: uvx pip-audit --strict .
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate distributions
        run: uv run --frozen python -m twine check --strict dist/*
      - name: Clean wheel install smoke
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist/*.whl
          wheelcheck/bin/pip check
          wheelcheck/bin/python - <<'PY'
          import eyeprocesspy as ep
          import tomllib
          from pathlib import Path
          expected_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert ep.__version__ == expected_version
          assert ep.__r_reference_version__ == "0.11.1"
          print(ep.__version__, ep.__r_reference_version__)
          PY
      - name: Clean sdist install smoke
        run: |
          python -m venv sdistcheck
          sdistcheck/bin/pip install dist/*.tar.gz
          sdistcheck/bin/pip check
          sdistcheck/bin/python - <<'PY'
          import eyeprocesspy as ep
          import tomllib
          from pathlib import Path
          expected_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert ep.__version__ == expected_version
          assert ep.__r_reference_version__ == "0.11.1"
          print(ep.__version__, ep.__r_reference_version__)
          PY
      - name: Generate SHA-256 release evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          sha256sum dist/* > release-evidence/SHA256SUMS.txt
          cat release-evidence/SHA256SUMS.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  tag_release:
    if: needs.resolve_release.outputs.should_release == 'true'
    needs:
      - resolve_release
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag after validation
        if: github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "${RELEASE_TAG} already points to ${existing}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the validated commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "eyeprocesspy ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Confirm externally supplied tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
        run: echo "Validated existing release tag ${RELEASE_TAG}"

  publish-pypi:
    if: needs.resolve_release.outputs.should_release == 'true'
    needs:
      - resolve_release
      - validate
      - tag_release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eyeprocesspy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    if: needs.resolve_release.outputs.should_release == 'true'
    needs:
      - resolve_release
      - validate
      - tag_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  github-release:
    if: needs.resolve_release.outputs.should_release == 'true'
    needs:
      - resolve_release
      - validate
      - tag_release
      - publish-pypi
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Create GitHub release after all publication gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* release-evidence/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "eyeprocesspy ${RELEASE_VERSION}"
