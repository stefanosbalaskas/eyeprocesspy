name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync release environment
        run: uv sync --frozen --extra dev
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = '${{ github.ref_name }}'
          expected = f'v{version}'
          if tag != expected:
              raise SystemExit(f'Release tag {tag!r} does not match package version {expected!r}')
          init_text = Path('src/eyeprocesspy/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit('pyproject.toml and eyeprocesspy.__version__ disagree')
          print('release version:', version)
          PY
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy src/eyeprocesspy
      - name: Full tests and 100% branch coverage
        run: uv run --frozen pytest --cov=eyeprocesspy --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - name: Deep parity release gate
        run: uv run --frozen python tools/deep_parity_audit.py --release-gate
      - name: Public API documentation gate
        run: uv run --frozen python tools/api_documentation_audit.py
      - name: Build documentation strictly
        run: uv run --frozen mkdocs build --strict
      - name: Audit published dependencies
        run: uvx pip-audit --strict .
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate distributions
        run: uv run python -m twine check --strict dist/*
      - name: Clean wheel install smoke
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist/*.whl
          wheelcheck/bin/pip check
          wheelcheck/bin/python - <<'PY'
          import eyeprocesspy as ep
          import tomllib
          from pathlib import Path
          expected_version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert ep.__version__ == expected_version
          assert ep.__r_reference_version__ == '0.11.1'
          print(ep.__version__, ep.__r_reference_version__)
          PY
      - name: Clean sdist install smoke
        run: |
          python -m venv sdistcheck
          sdistcheck/bin/pip install dist/*.tar.gz
          sdistcheck/bin/pip check
          sdistcheck/bin/python - <<'PY'
          import eyeprocesspy as ep
          import tomllib
          from pathlib import Path
          expected_version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert ep.__version__ == expected_version
          assert ep.__r_reference_version__ == '0.11.1'
          print(ep.__version__, ep.__r_reference_version__)
          PY
      - name: Generate SHA-256 release evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          sha256sum dist/* > release-evidence/SHA256SUMS.txt
          cat release-evidence/SHA256SUMS.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eyeprocesspy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  github-release:
    if: github.ref_type == 'tag'
    needs:
      - validate
      - publish-pypi
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Create GitHub release after all publication gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* release-evidence/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "eyeprocesspy ${GITHUB_REF_NAME#v}"
