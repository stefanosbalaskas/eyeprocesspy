name: Validate 0.2.1 release extra lock

on:
  push:
    branches:
      - release/0.2.1-lockfix

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.2.1-lockfix
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Validate frozen release extras
        run: uv sync --frozen --extra dev --extra narrow
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-021-lockfix.yml
          git commit -m "Remove one-shot release-extra validator"
          git push origin HEAD:release/0.2.1-lockfix
