name: Normalize final coverage test formatting

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-q-lint.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rewrite dense Gazepoint summary test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_release_coverage_closure_q.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_gazepoint_summary_metadata_false_paths")
          end = text.index("\ndef test_preprocess_bounds_existing_mark_and_empty_ivt_group", start)
          replacement = '''def test_gazepoint_summary_metadata_false_paths(monkeypatch, tmp_path):
              monkeypatch.setattr(gr, "_gp_is_summary_report", lambda p: True)

              one = tmp_path / "one.csv"
              one.write_text("Gazepoint Analysis,7.2.0\\n", encoding="utf-8")
              first = gr.read_gazepoint_summary(one)
              assert pd.isna(first.processed_on)

              two = tmp_path / "two.csv"
              two.write_text(
                  "Gazepoint Analysis,7.2.0\\nProcessed On\\n",
                  encoding="utf-8",
              )
              second = gr.read_gazepoint_summary(two)
              assert pd.isna(second.processed_on)
          '''
          path.write_text(text[:start] + replacement + text[end + 1 :], encoding="utf-8")
          PY

      - name: Remove one-time helper and commit
        run: |
          rm .github/workflows/fix-q-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_release_coverage_closure_q.py .github/workflows/fix-q-lint.yml
          git commit -m "test: normalize final coverage closure formatting"
          git push origin HEAD:main
