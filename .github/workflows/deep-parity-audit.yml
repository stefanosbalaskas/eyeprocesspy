name: Deep parity audit

on:
  push:
    branches:
      - release/0.1.0-deep-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync development environment
        run: uv sync --extra dev --extra arrow
      - name: Parity debt audit
        run: uv run python tools/deep_parity_audit.py
      - name: Public API documentation audit
        run: uv run python tools/api_documentation_audit.py
      - name: Coverage baseline
        run: |
          uv run coverage erase
          uv run coverage run --branch --source=eyeprocesspy -m pytest -q
          uv run coverage json -o coverage.json
          uv run coverage report -m --fail-under=0
      - name: Coverage summary
        run: |
          python - <<'PY'
          import json
          data = json.load(open('coverage.json', encoding='utf-8'))
          totals = data['totals']
          print(f"COVERAGE_PERCENT={totals['percent_covered']}")
          print(f"COVERAGE_STATEMENTS={totals['covered_lines']}/{totals['num_statements']}")
          print(f"COVERAGE_BRANCHES={totals.get('covered_branches', 0)}/{totals.get('num_branches', 0)}")
          PY
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-parity-coverage
          path: coverage.json
          if-no-files-found: error
      - name: Enforce true 100 percent statement and branch coverage
        run: |
          python - <<'PY'
          import json
          data = json.load(open('coverage.json', encoding='utf-8'))
          totals = data['totals']
          lines_ok = totals['covered_lines'] == totals['num_statements']
          branches_ok = totals.get('covered_branches', 0) == totals.get('num_branches', 0)
          if not lines_ok or not branches_ok:
              raise SystemExit(
                  'Coverage gate failed: '
                  f"lines {totals['covered_lines']}/{totals['num_statements']}; "
                  f"branches {totals.get('covered_branches', 0)}/{totals.get('num_branches', 0)}"
              )
          print('COVERAGE_GATE=PASS')
          PY
