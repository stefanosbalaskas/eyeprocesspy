name: Ruff diagnostics

on:
  push:
    paths:
      - '.github/workflows/ruff-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          ruff check src tests --output-format=concise > ruff-diagnostics.txt 2>&1
          code=$?
          echo "ruff_exit_code=$code" >> ruff-diagnostics.txt
          cat ruff-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ruff-diagnostics.txt
          git commit -m 'ci: record Ruff diagnostics'
          git push