name: One-shot residual test repairs

on:
  push:
    branches:
      - release/0.1.0-deep-parity

permissions:
  contents: write

concurrency:
  group: one-shot-residual-test-repairs
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-deep-parity
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Apply exact residual-test corrections
        shell: python
        run: |
          from pathlib import Path

          storage = Path('tests/test_interoperability_storage_10_residual_coverage.py')
          text = storage.read_text(encoding='utf-8')
          replacements = [
              ('tables=["fixations"]', 'tables=["episodes"]'),
              ('empty_path / "fixations" / "part-0.parquet"', 'empty_path / "episodes" / "part-0.parquet"'),
              ('if meta.get("Columns") is None:', 'if "Columns" in meta and meta["Columns"] is None:'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          storage.write_text(text, encoding='utf-8')

          evidence = Path('tests/test_validation_evidence_10_residual_coverage.py')
          text = evidence.read_text(encoding='utf-8')
          old = 'tied["ranks"].rank.iloc[0]'
          new = 'tied["ranks"]["rank"].iloc[0]'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one tied-rank occurrence, found {count}')
          evidence.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate focused residual suites
        run: |
          uv sync --extra dev
          uv run pytest -q tests/test_interoperability_storage_10_residual_coverage.py tests/test_validation_evidence_10_residual_coverage.py
          uv run ruff check tests/test_interoperability_storage_10_residual_coverage.py tests/test_validation_evidence_10_residual_coverage.py

      - name: Commit exact repairs and self-clean
        run: |
          git restore uv.lock
          git rm .github/workflows/one-shot-residual-test-repairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_interoperability_storage_10_residual_coverage.py tests/test_validation_evidence_10_residual_coverage.py
          git commit -m "test: repair storage and evidence residual fixtures"
          git pull --rebase origin release/0.1.0-deep-parity
          git push origin HEAD:release/0.1.0-deep-parity
