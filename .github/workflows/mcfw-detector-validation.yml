name: MCFW-Gaze detector validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/chi-gaze-claim-robustness
    paths:
      - .github/workflows/mcfw-detector-validation.yml
      - research/gaze_claim_robustness/mcfw_adapter.py
      - research/gaze_claim_robustness/mcfw_coordinates.py
      - research/gaze_claim_robustness/mcfw_decision_registry.csv
      - research/gaze_claim_robustness/mcfw_validation_protocol.md
      - research/gaze_claim_robustness/run_mcfw_detector_validation.py
      - research/gaze_claim_robustness/summarise_mcfw_validation.py

concurrency:
  group: mcfw-detector-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ZENODO_RECORD_ID: "20300972"
      RESEARCH_DIR: research/gaze_claim_robustness

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install frozen research environment
        run: uv sync --frozen --extra dev

      - name: Resolve frozen MCFW-Gaze archive
        id: zenodo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/source validation/audit
          uv run --frozen python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          record_id = os.environ["ZENODO_RECORD_ID"]
          url = f"https://zenodo.org/api/records/{record_id}"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "eyeprocesspy-mcfw-validation/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              record = json.load(response)

          files = {
              str(item.get("key", "")): item
              for item in record.get("files", [])
          }
          selected = files.get("dataset.zip")
          if selected is None:
              raise SystemExit("Frozen MCFW record does not expose dataset.zip.")

          links = selected.get("links", {})
          download = links.get("content") or links.get("self")
          if not download:
              raise SystemExit("dataset.zip has no usable download link.")

          metadata = {
              "record_id": record_id,
              "doi": record.get("doi"),
              "title": record.get("metadata", {}).get("title"),
              "dataset_file": "dataset.zip",
              "size": int(selected.get("size", 0)),
              "checksum": str(selected.get("checksum", "")).strip(),
              "download_url": download,
          }
          if metadata["size"] <= 0:
              raise SystemExit("dataset.zip has no positive size.")

          Path("validation/source/zenodo_selected_file.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(f"dataset_url={download}\n")
              handle.write(f"dataset_size={metadata['size']}\n")
              handle.write(f"dataset_checksum={metadata['checksum']}\n")
          PY

      - name: Download and verify frozen archive
        shell: bash
        env:
          DATASET_URL: ${{ steps.zenodo.outputs.dataset_url }}
          EXPECTED_SIZE: ${{ steps.zenodo.outputs.dataset_size }}
          EXPECTED_CHECKSUM: ${{ steps.zenodo.outputs.dataset_checksum }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/mcfw-dataset.zip"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            --continue-at - --output "$ARCHIVE" "$DATASET_URL"

          ACTUAL_SIZE="$(stat -c '%s' "$ARCHIVE")"
          ACTUAL_MD5="$(md5sum "$ARCHIVE" | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

          printf '%s\n' \
            "expected_size=$EXPECTED_SIZE" \
            "actual_size=$ACTUAL_SIZE" \
            "published_checksum=$EXPECTED_CHECKSUM" \
            "actual_md5=$ACTUAL_MD5" \
            "actual_sha256=$ACTUAL_SHA256" \
            > validation/source/download_integrity.txt

          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          if [[ "$EXPECTED_CHECKSUM" == md5:* ]]; then
            test "$ACTUAL_MD5" = "${EXPECTED_CHECKSUM#md5:}"
          fi

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract archive and resolve dataset root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/mcfw-extracted"
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"
          ROOT="$(find "$DEST" -type d -name data -printf '%h\n' | head -1)"
          test -n "$ROOT"
          test -d "$ROOT/data"
          echo "EXTRACTED_ROOT=$DEST" >> "$GITHUB_ENV"
          echo "dataset_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Rebuild raw archive manifest
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/audit_mcfw_dataset.py" \
            "${{ steps.root.outputs.dataset_root }}" \
            --output-dir validation/audit

      - name: Enforce frozen archive identity and structural denominator
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import pandas as pd

          manifest = pd.read_csv("validation/audit/mcfw_file_manifest.csv")
          failures = pd.read_csv("validation/audit/mcfw_failures.csv")

          expected_families = {
              "natural_image",
              "gaze_pattern_auth",
              "password",
              "web_shopping",
              "web_news",
              "web_video",
          }
          if len(failures):
              raise SystemExit(
                  f"Raw audit has {len(failures)} file failures."
              )
          if len(manifest) != 4695:
              raise SystemExit(
                  f"Expected 4695 trial files; found {len(manifest)}."
              )
          if manifest["participant"].nunique() != 15:
              raise SystemExit(
                  "Expected exactly 15 MCFW participants."
              )
          if set(manifest["trial_family"].astype(str)) != expected_families:
              raise SystemExit("MCFW context-family set changed.")
          if int(manifest["n_samples"].sum()) != 6304159:
              raise SystemExit(
                  "MCFW total sample count changed from frozen pre-analysis audit."
              )
          print("Frozen MCFW archive denominator gate: PASS")
          PY

      - name: Execute complete frozen detector-validation universe
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/run_mcfw_detector_validation.py" \
            "${{ steps.root.outputs.dataset_root }}" \
            validation/audit/mcfw_file_manifest.csv \
            --output-dir validation/results \
            --workers 2

      - name: Validate planned result denominators
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import pandas as pd

          events = pd.read_csv(
              "validation/results/mcfw_detector_event_summaries.csv"
          )
          pairs = pd.read_csv(
              "validation/results/mcfw_detector_pairwise_agreement.csv"
          )

          expected = 4695 * 2 * 3
          if len(events) != expected:
              raise SystemExit(
                  f"Expected {expected} detector summary rows; found {len(events)}."
              )
          if len(pairs) != expected:
              raise SystemExit(
                  f"Expected {expected} detector-pair rows; found {len(pairs)}."
              )

          event_key = ["relative_path", "eye", "detector_id"]
          pair_key = ["relative_path", "eye", "detector_a", "detector_b"]
          if events.duplicated(event_key).any():
              raise SystemExit("Duplicate detector-summary planned keys.")
          if pairs.duplicated(pair_key).any():
              raise SystemExit("Duplicate detector-pair planned keys.")
          print("MCFW planned-denominator gate: PASS")
          PY

      - name: Summarize detector agreement, context, and quality association
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python "$RESEARCH_DIR/summarise_mcfw_validation.py" \
            validation/results \
            --output-dir validation/summary

      - name: Record validation provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=stefanosbalaskas/eyeprocesspy"
            echo "analysis_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "zenodo_record_id=${ZENODO_RECORD_ID}"
            echo "timestamp_scale_seconds=1e-6"
            echo "nominal_sampling_rate_hz=120"
            echo "screen_px=1920x1080"
            echo "screen_mm=310x175"
            echo "viewing_distance_mm=650_approximate"
            echo "detector_input=contiguous_source_usable_runs"
            echo "shared_run_gap_ms=75"
            echo "published_quality_proportion_fields=quarantined"
          } > validation/ANALYSIS_PROVENANCE.txt

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfw-detector-validation-${{ github.sha }}
          path: validation/
          if-no-files-found: error
          retention-days: 30

      - name: Remove downloaded research data
        if: always()
        shell: bash
        run: |
          rm -rf "${EXTRACTED_ROOT:-}"
          rm -f "${ARCHIVE:-}"
