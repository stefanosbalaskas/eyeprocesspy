name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "docs-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install package and documentation dependencies
        run: uv sync --extra docs
      - name: Build documentation strictly
        run: uv run mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for legacy Jekyll Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          legacy_run=""
          for attempt in {1..8}; do
            legacy_run="$(
              gh api "repos/${REPOSITORY}/actions/runs?event=dynamic&head_sha=${HEAD_SHA}&per_page=20" \
                --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .id' \
                | head -n 1
            )"
            if [[ -n "${legacy_run}" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${legacy_run}" ]]; then
            echo "No legacy Jekyll Pages run found for ${HEAD_SHA}; deploying MkDocs directly."
            exit 0
          fi

          echo "Legacy Pages run ${legacy_run} detected. Waiting for it to finish before publishing MkDocs."
          for attempt in {1..120}; do
            status="$(gh api "repos/${REPOSITORY}/actions/runs/${legacy_run}" --jq '.status')"
            if [[ "${status}" == "completed" ]]; then
              conclusion="$(gh api "repos/${REPOSITORY}/actions/runs/${legacy_run}" --jq '.conclusion')"
              echo "Legacy Pages run completed with conclusion=${conclusion}. MkDocs will publish last."
              exit 0
            fi
            sleep 5
          done

          echo "Legacy Pages run did not complete within the safety window." >&2
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
