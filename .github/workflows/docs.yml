name: Documentation

on:
  push:
    branches:
      - release/0.1.0-deep-parity
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: "docs-validation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install package and documentation dependencies
        run: uv sync --extra docs
      - name: Build documentation strictly
        run: uv run mkdocs build --strict
      - name: Request protected Pages deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/0.1.0-deep-parity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
