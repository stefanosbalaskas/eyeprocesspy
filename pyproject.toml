[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeprocesspy"
version = "0.1.0.dev0"
description = "Python parity implementation of eyeprocess: vendor-neutral eye-tracking and multimodal process-data infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Stefanos Balaskas"}]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13"]

[project.optional-dependencies]
arrow = ["pyarrow>=20"]
stan = ["cmdstanpy>=1.3"]
bayes = ["pymc", "arviz"]
physio = ["neurokit2", "biosppy"]
streaming = ["pylsl", "pyxdf"]
gaze = ["pymovements", "remodnav", "multimatch-gaze"]
psychometrics = ["girth", "catsim", "patsy>=1.0", "statsmodels>=0.14"]
plots = ["matplotlib>=3.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12", "mypy>=1.15", "build>=1.2", "matplotlib>=3.9", "patsy>=1.0", "statsmodels>=0.14"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eyeprocesspy = ["resources/stan/*.stan", "resources/extdata/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
