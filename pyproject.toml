[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeprocesspy"
version = "0.1.0"
description = "Vendor-neutral Python infrastructure for eye-tracking, pupillometry, biometrics, psychometrics, and multimodal process data, ported from eyeprocess 0.11.1."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Stefanos Balaskas"},
]
keywords = [
  "eye-tracking",
  "pupillometry",
  "biometrics",
  "psychometrics",
  "item-response-theory",
  "multimodal",
  "behavioral-data",
  "gazepoint",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/stefanosbalaskas/eyeprocesspy"
Documentation = "https://stefanosbalaskas.github.io/eyeprocesspy/"
Source = "https://github.com/stefanosbalaskas/eyeprocesspy"
Issues = "https://github.com/stefanosbalaskas/eyeprocesspy/issues"
Changelog = "https://github.com/stefanosbalaskas/eyeprocesspy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
arrow = ["pyarrow>=20"]
stan = ["cmdstanpy>=1.3"]
bayes = ["pymc", "arviz"]
physio = ["neurokit2", "biosppy"]
streaming = ["pylsl", "pyxdf"]
gaze = ["pymovements", "remodnav", "multimatch-gaze"]
psychometrics = ["girth", "catsim", "patsy>=1.0", "statsmodels>=0.14"]
plots = ["matplotlib>=3.9"]
ml = ["scikit-learn>=1.5"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "coverage[toml]>=7.10",
  "ruff>=0.12",
  "mypy>=1.15",
  "build>=1.2",
  "twine>=6",
  "matplotlib>=3.9",
  "patsy>=1.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "pyarrow>=20",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eyeprocesspy = [
  "resources/stan/*.stan",
  "resources/extdata/*.csv",
  "resources/extdata/benchmark-study/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["eyeprocesspy"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if j >= n:',
  'if md > float\(spec\.missingness_tolerance\) and status == "LOSSLESS":',
  'raise AssertionError\("unreachable"\)',
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
