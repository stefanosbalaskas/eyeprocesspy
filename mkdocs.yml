site_name: eyeprocesspy
site_description: Reproducible Python infrastructure for eye-tracking, pupillometry, AOIs, process data, psychometrics, validation, and multimodal behavioral measurement.
site_url: https://stefanosbalaskas.github.io/eyeprocesspy/
site_author: Stefanos Balaskas
repo_url: https://github.com/stefanosbalaskas/eyeprocesspy
repo_name: stefanosbalaskas/eyeprocesspy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Stefanos Balaskas · MIT License

