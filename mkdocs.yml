site_name: eyeprocesspy
site_description: Reproducible Python infrastructure for eye-tracking, pupillometry, AOIs, process data, psychometrics, validation, and multimodal behavioral measurement.
site_url: https://stefanosbalaskas.github.io/eyeprocesspy/
site_author: Stefanos Balaskas
repo_url: https://github.com/stefanosbalaskas/eyeprocesspy
repo_name: stefanosbalaskas/eyeprocesspy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Stefanos Balaskas · MIT License

# The complete 88-article corpus remains built and searchable, but only its
# curated entry points are exposed in the primary navigation.
not_in_nav: |
  /articles/*.md

nav:
  - Home: index.md
  - Start Here:
      - Getting started: getting-started.md
      - Manual installation: manual-install.md
      - Cookbook: cookbook.md
      - FAQ: faq.md
  - Workflows:
      - Scientific guide map: guides/index.md
      - Eye-tracking end to end: guides/end-to-end-eye-tracking.md
      - Gazepoint import & QC: guides/gazepoint-import-qc.md
      - Pupillometry: guides/pupillometry.md
      - Quality & uncertainty: guides/process-quality-uncertainty.md
      - Psychometrics & IRT: guides/psychometrics-irt.md
      - Reproducibility & release evidence: guides/reproducibility-release-evidence.md
      - Worked examples:
          - Overview: examples/index.md
          - Core gaze, AOI & provenance: examples/core-workflow.md
          - Calibration uncertainty & probabilistic AOIs: examples/calibration-probabilistic-aoi.md
          - Process reliability: examples/process-reliability.md
          - IRT diagnostics: examples/irt-diagnostics.md
  - Plot gallery: gallery.md
  - Articles:
      - 88-workflow library: articles/index.md
      - Featured workflows: articles/featured-workflows.md
  - Reference:
      - Reference map: reference/index.md
      - Complete API reference: reference/api.md
      - Plotting reference: reference/plotting.md
  - Validation & trust:
      - Parity & validation: parity-and-validation.md
      - Release & reproducibility: release-and-reproducibility.md

theme:
  name: material
  language: en
  logo: https://raw.githubusercontent.com/stefanosbalaskas/gpbiometricspy/main/docs/assets/python-suite-logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/eyeprocesspy
      name: eyeprocesspy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eyeprocesspy/
      name: eyeprocesspy on PyPI
    - icon: material/archive-outline
      link: https://doi.org/10.5281/zenodo.22285167
      name: eyeprocesspy on Zenodo
